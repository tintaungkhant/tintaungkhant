<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-labelledby="title">
  <title id="title">Zay Thal Gyi Copilot: private, in development. A tool-calling commerce assistant with code-enforced safeguards.</title>
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .bar { fill: #8c959f; }
    .name { fill: #1f2328; font: 600 26px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .desc { fill: #59636e; font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .meta { fill: #59636e; font: 400 13.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sep { stroke: #d8dee4; }
    .pill-gray { fill: none; stroke: #8c959f; }
    .pill-gray-t { fill: #59636e; font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; }
    .pill-amber { fill: none; stroke: #bf8700; }
    .pill-amber-t { fill: #9a6700; font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161b22; stroke: #30363d; }
      .bar { fill: #6e7681; }
      .name { fill: #e6edf3; }
      .desc, .meta, .pill-gray-t { fill: #9198a1; }
      .sep { stroke: #30363d; }
      .pill-gray { stroke: #6e7681; }
      .pill-amber { stroke: #d29922; }
      .pill-amber-t { fill: #d29922; }
    }
  </style>
  <rect class="card" x="1" y="1" width="598" height="218" rx="14"/>
  <rect class="bar" x="1" y="1" width="598" height="4" rx="2"/>

  <text class="name" x="32" y="56">Zay Thal Gyi Copilot</text>
  <rect class="pill-gray" x="337" y="37" width="84" height="24" rx="12"/>
  <text class="pill-gray-t" x="379" y="53" text-anchor="middle">PRIVATE</text>
  <rect class="pill-amber" x="429" y="37" width="139" height="24" rx="12"/>
  <text class="pill-amber-t" x="498.5" y="53" text-anchor="middle">IN DEVELOPMENT</text>

  <text class="desc" x="32" y="98">Business actions, beyond the chat box.</text>
  <text class="desc" x="32" y="122">An AI assistant grounded in business workflows.</text>
  <text class="desc" x="32" y="146">Tool calling, evaluation and code-enforced rules.</text>

  <line class="sep" x1="32" y1="168" x2="568" y2="168"/>
  <circle cx="38" cy="192" r="6" fill="#3178c6"/>
  <text class="meta" x="52" y="196">TypeScript · AI agents</text>
  <text class="meta" x="568" y="196" text-anchor="end">playground testing · not live</text>
</svg>
