<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220" role="img" aria-labelledby="title">
  <title id="title">laravel-http-beacon: public. Searchable HTTP observability for Laravel.</title>
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .bar { fill: #0969da; }
    .name { fill: #1f2328; font: 600 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .desc { fill: #59636e; font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .meta { fill: #59636e; font: 400 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sep { stroke: #d8dee4; }
    .pill-blue { fill: none; stroke: #0969da; }
    .pill-blue-t { fill: #0969da; font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #161b22; stroke: #30363d; }
      .bar { fill: #4493f8; }
      .name { fill: #e6edf3; }
      .desc, .meta { fill: #9198a1; }
      .sep { stroke: #30363d; }
      .pill-blue { stroke: #4493f8; }
      .pill-blue-t { fill: #4493f8; }
    }
  </style>
  <rect class="card" x="1" y="1" width="598" height="218" rx="14"/>
  <rect class="bar" x="1" y="1" width="598" height="4" rx="2"/>

  <text class="name" x="32" y="56">laravel-http-beacon</text>
  <rect class="pill-blue" x="499" y="37" width="69" height="24" rx="12"/>
  <text class="pill-blue-t" x="533.5" y="53" text-anchor="middle">PUBLIC</text>

  <text class="desc" x="32" y="98">Searchable HTTP observability for Laravel. Logs incoming and</text>
  <text class="desc" x="32" y="122">outgoing traffic with related queries, model changes and jobs.</text>
  <text class="desc" x="32" y="146">Filter by route, method, status and date. Indexed, auto-pruned.</text>

  <line class="sep" x1="32" y1="168" x2="568" y2="168"/>
  <circle cx="38" cy="192" r="6" fill="#4F5D95"/>
  <text class="meta" x="52" y="196">PHP · Laravel</text>
  <text class="meta" x="568" y="196" text-anchor="end">used in company projects</text>
</svg>
