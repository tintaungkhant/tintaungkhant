<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title">
  <title id="title">Tint Aung Khant: Senior Backend Engineer and AI-First Software Engineer</title>
  <style>
    .card { fill: #ffffff; stroke: #d0d7de; }
    .dot { fill: #8c959f; }
    .eyebrow { fill: #0969da; font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2px; }
    .name { fill: #1f2328; font: 650 56px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -1px; }
    .role { fill: #59636e; font: 400 21px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .cmd { fill: #1f2328; font: 400 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .prompt, .accent { fill: #0969da; }
    .cursor { fill: #0969da; animation: blink 1.1s steps(1) infinite; }
    .node { fill: #f6f8fa; stroke: #d0d7de; }
    .node-key { fill: #ddf4ff; stroke: #0969da; }
    .ntitle { fill: #1f2328; font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .nsub { fill: #59636e; font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .edge { stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    .arrow { fill: #8c959f; }
    .pulse { fill: #0969da; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .dot { fill: #6e7681; }
      .eyebrow, .prompt, .accent, .cursor, .pulse { fill: #4493f8; }
      .name, .cmd, .ntitle { fill: #e6edf3; }
      .role, .nsub { fill: #9198a1; }
      .node { fill: #161b22; stroke: #30363d; }
      .node-key { fill: #0c2d6b; stroke: #4493f8; }
      .edge { stroke: #6e7681; }
      .arrow { fill: #6e7681; }
    }
  </style>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle class="dot" cx="2" cy="2" r="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0.4" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.5"/>
    </linearGradient>
    <mask id="fadeMask"><rect width="1200" height="320" fill="url(#fade)"/></mask>
    <marker id="head" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path class="arrow" d="M0 0 L8 4 L0 8 z"/>
    </marker>
  </defs>

  <rect class="card" x="1" y="1" width="1198" height="318" rx="16"/>
  <rect x="1" y="1" width="1198" height="318" rx="16" fill="url(#dots)" mask="url(#fadeMask)"/>

  <text class="eyebrow" x="64" y="92">BACKEND SYSTEMS · AI PRODUCTS · BUSINESS-FIRST</text>
  <text class="name" x="64" y="152">Tint Aung Khant</text>
  <text class="role" x="64" y="194">Senior Backend Engineer &amp; AI-First Software Engineer</text>
  <rect class="accent" x="64" y="220" width="56" height="3" rx="1.5"/>
  <text class="cmd" x="64" y="264"><tspan class="prompt">$ </tspan>ship --simple --tested --reviewed <tspan class="cursor">▋</tspan></text>

  <!-- request → LLM (intent) → code (invariants) → postgres / reply -->
  <path class="edge" d="M910 80 H986" marker-end="url(#head)"/>
  <path class="edge" d="M1065 104 V144" marker-end="url(#head)"/>
  <path class="edge" d="M990 172 H914" marker-end="url(#head)"/>
  <path class="edge" d="M1065 196 V236" marker-end="url(#head)"/>

  <g>
    <rect class="node" x="760" y="56" width="150" height="48" rx="10"/>
    <text class="ntitle" x="835" y="76" text-anchor="middle">request</text>
    <text class="nsub" x="835" y="93" text-anchor="middle">what the user wants</text>

    <rect class="node" x="990" y="56" width="150" height="48" rx="10"/>
    <text class="ntitle" x="1065" y="76" text-anchor="middle">LLM</text>
    <text class="nsub" x="1065" y="93" text-anchor="middle">interprets intent</text>

    <rect class="node-key" x="990" y="148" width="150" height="48" rx="10" stroke-width="1.5"/>
    <text class="ntitle" x="1065" y="168" text-anchor="middle">code</text>
    <text class="nsub" x="1065" y="185" text-anchor="middle">enforces invariants</text>

    <rect class="node" x="760" y="148" width="150" height="48" rx="10"/>
    <text class="ntitle" x="835" y="168" text-anchor="middle">postgres</text>
    <text class="nsub" x="835" y="185" text-anchor="middle">persists state</text>

    <rect class="node" x="990" y="240" width="150" height="48" rx="10"/>
    <text class="ntitle" x="1065" y="260" text-anchor="middle">reply</text>
    <text class="nsub" x="1065" y="277" text-anchor="middle">validated, then sent</text>
  </g>

  <circle class="pulse" r="3.5"><animateMotion dur="3.2s" repeatCount="indefinite" path="M910 80 H986" keyTimes="0;0.25;1" keyPoints="0;1;1" calcMode="linear"/></circle>
  <circle class="pulse" r="3.5"><animateMotion dur="3.2s" repeatCount="indefinite" path="M1065 104 V144" keyTimes="0;0.25;0.5;1" keyPoints="0;0;1;1" calcMode="linear"/></circle>
  <circle class="pulse" r="3.5"><animateMotion dur="3.2s" repeatCount="indefinite" path="M990 172 H914" keyTimes="0;0.5;0.75;1" keyPoints="0;0;1;1" calcMode="linear"/></circle>
  <circle class="pulse" r="3.5"><animateMotion dur="3.2s" repeatCount="indefinite" path="M1065 196 V236" keyTimes="0;0.5;0.75;1" keyPoints="0;0;1;1" calcMode="linear"/></circle>
</svg>
