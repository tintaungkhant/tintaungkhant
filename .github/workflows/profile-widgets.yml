name: Profile widgets

on:
  schedule:
    - cron: "0 0 * * *" # daily, 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency: profile-widgets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution Space Shooter
        uses: czl9707/gh-space-shooter@b24c9792454d1a2e0139ccf72840424e1f83c3f2 # Supports no-commit
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          output-path: assets/contributions/space-shooter.gif
          strategy: random
          fps: '25'
          no-commit: 'true'

      - name: Commit refreshed widgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/contributions
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile widgets"
          git push
