name: Profile widgets

on:
  schedule:
    - cron: "0 0 * * *" # daily, 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency: profile-widgets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Simulate contribution gravity
        uses: flycran/github-gravity@v1
        with:
          username: ${{ github.repository_owner }}
          text: Tint Aung Khant
          output-path: ${{ runner.temp }}/gravity-raw.svg
          font-size: '72'
          sample-rate: '8'
          shape: circle
          text-top: '70'
          text-color: '#79c0ff'

      - name: Create looping contribution animations
        run: node scripts/finalize-gravity.mjs "${{ runner.temp }}/gravity-raw.svg"

      - name: Commit refreshed widgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/contributions
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile widgets"
          git push
