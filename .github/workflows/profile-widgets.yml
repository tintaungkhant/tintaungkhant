name: Profile widgets

on:
  schedule:
    - cron: "0 0 * * *" # daily, 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency: profile-widgets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contributions/snake-light.svg?color_snake=%230969da&color_dots=%23ebedf0,%23dbeafe,%2393c5fd,%233b82f6,%231d4ed8
            assets/contributions/snake-dark.svg?palette=github-dark&color_snake=%2358a6ff&color_dots=%23161b22,%230c2d6b,%231f6feb,%233889ef,%2379c0ff

      # 3D contribution calendar -> profile-3d-contrib/*.svg
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # Language cards -> profile-summary-card-output/<theme>/*.svg
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github
          AUTO_PUSH: false

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github_dark
          AUTO_PUSH: false

      - name: Commit refreshed widgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/contributions profile-3d-contrib profile-summary-card-output
          git commit -m "chore: refresh profile widgets" || exit 0
          git push
